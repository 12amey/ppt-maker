services:
  - type: web
    name: ppt-maker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "80"
      - key: APP_DATA_DIRECTORY
        value: /app_data
      - key: TEMP_DIRECTORY
        value: /tmp/presenton
      - key: PRESENTON_HOST_HTTP_PORT
        value: "80"
      - key: PRESENTON_PUBLIC_URL
        fromService:
          type: web
          name: ppt-maker
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_ON_STARTUP
        value: "true"
      - key: DISABLE_AUTH
        value: "false"
      - key: NEXT_PUBLIC_DISABLE_AUTH
        value: "false"
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
